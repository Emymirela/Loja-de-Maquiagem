{% extends "base.html" %}

{% block title %}Cadastro | Beauty Makeup{% endblock %}

{% block content %}
    <h1>✨ Criar Nova Conta</h1>
    <p>Complete o formulário para se cadastrar e começar a gerenciar seus cosméticos.</p>

    <form action="" method="post">
        <label for="name">Nome Completo:</label>
        <input type="text" id="name" name="nome" placeholder="Seu nome" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>

        <label for="telefone">Telefone / WhatsApp:</label>
        <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999">

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••" required>

        <input type="submit" value="Criar Minha Conta">
    </form>

    <p class="mt-3">Já tem uma conta? <a href="{{ url_for('auth.login') }}">Faça login aqui</a>.</p>
{% endblock %}
