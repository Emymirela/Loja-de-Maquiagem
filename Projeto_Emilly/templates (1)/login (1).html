{% extends "base.html" %}

{% block title %}Login | Beauty Makeup{% endblock %}

{% block content %}
    <h1>✨ Acesse sua Conta</h1>
    <p>Entre para gerenciar seu estoque e catálogo de maquiagens.</p>
    
    <form action="{{ url_for('auth.submit_login') }}" method="post">
        <label for="login">Email:</label>
        <input type="email" id="login" name="login" placeholder="seuemail@exemplo.com" required>

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" placeholder="••••••••" required>

        <input type="submit" value="Entrar no Sistema">
    </form>
    
    <p class="mt-3">Não tem uma conta? <a href="{{ url_for('user.cadastro_usuario') }}">Cadastre-se aqui</a>.</p>
{% endblock %}
